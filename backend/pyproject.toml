[project]
name = "skn35-final-4team"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=5.1.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-postgres>=3.2.1",
    "lightgbm>=4.7.0",
    "mcp>=2.3.0",
    "numpy>=2.5.4",
    "openai>=3.46.0",
    "opentelemetry-sdk>=1.45.2",
    "pandas>=3.1.1",
    "pgvector>=0.5.1",
    "playwright>=1.64.1",
    "plotly>=7.1.0",
    "ppi-python>=0.2.3",
    "psycopg[binary]>=3.3.8",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.2.4",
    "radon>=6.0.1",
    "rank-bm25>=0.2.2",
    "redis>=8.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pgserver>=0.1.4",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
gpu = [
    "accelerate>=1.15.0 ; sys_platform == 'linux'",
    "bitsandbytes>=0.50.2 ; sys_platform == 'linux'",
    "peft>=0.21.2 ; sys_platform == 'linux'",
    "torch>=2.15.0 ; sys_platform == 'linux'",
    "transformers>=5.22.1 ; sys_platform == 'linux'",
    "trl>=1.17.1 ; sys_platform == 'linux'",
]
linux-tools = [
    "semgrep>=1.79.0 ; sys_platform == 'linux'",
    "swebench>=5.0.2 ; sys_platform == 'linux'",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
