[project]
name = "skn35-final-4team"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "celery>=5.7.0",
    "datasets>=5.1.0",
    "django>=6.1.3",
    "djangorestframework>=3.18.3",
    "langchain>=1.4.9",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "lightgbm>=4.7.0",
    "mcp>=2.3.0",
    "numpy>=2.5.4",
    "openai>=3.46.0",
    "pandas>=3.1.1",
    "pgvector>=0.5.1",
    "playwright>=1.64.1",
    "plotly>=7.1.0",
    "ppi-python>=0.2.3",
    "psycopg[binary]>=3.3.8",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.2.4",
    "radon>=6.0.1",
    "rank-bm25>=0.2.2",
    "redis>=8.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
gpu = [
    "accelerate>=1.15.0 ; sys_platform == 'linux'",
    "bitsandbytes>=0.50.2 ; sys_platform == 'linux'",
    "peft>=0.21.2 ; sys_platform == 'linux'",
    "torch>=2.15.0 ; sys_platform == 'linux'",
    "transformers>=5.22.1 ; sys_platform == 'linux'",
    "trl>=1.17.1 ; sys_platform == 'linux'",
]
linux-tools = [
    "semgrep>=1.79.0 ; sys_platform == 'linux'",
    "swebench>=5.0.2 ; sys_platform == 'linux'",
]
